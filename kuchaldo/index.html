<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SQUISH BRAWL - Platform Brawler</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Top Match HUD (Simplified Layout: MY SCORE, TIME, TIME SURVIVED, Bot Count) -->
    <header id="hud" class="hud-layer">
      <!-- TOP-LEFT: MY SCORE -->
      <div class="hud-left">
        <div class="hud-score-card" id="hud-score-card">
          <span class="hud-score-label">MY SCORE:</span>
          <span class="hud-score-val" id="hud-my-score">0</span>
        </div>
      </div>

      <!-- TOP-CENTER: Match Timer and TIME SURVIVED -->
      <div class="hud-center">
        <div class="hud-timers-row">
          <div class="match-timer-box" id="match-timer-container">
            <span class="timer-icon">⏱</span>
            <span id="match-timer">01:30</span>
          </div>
          <div class="survived-box" id="survived-container">
            <span class="survived-prefix">TIME SURVIVED:</span>
            <span id="hud-time-survived">00:00</span>
          </div>
        </div>
      </div>

      <!-- TOP-RIGHT: Bot Count Indicator & Sound Controls -->
      <div class="hud-right">
        <div class="bots-count-pill" id="bots-count-pill">
          <span class="bots-icon">🤖</span>
          <span id="alive-count">BOTS: 3/3</span>
        </div>

        <div class="hud-buttons-cluster">
          <button id="btn-sound" class="hud-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">🔊</button>
          <button id="btn-music" class="hud-btn" title="Toggle Music (B)" aria-label="Toggle Music">🎵</button>
        </div>
      </div>
    </header>

    <!-- Center Announcer & Overlay Banner -->
    <div id="announcer-overlay" class="announcer-overlay hidden">
      <div id="announcer-text" class="announcer-text">3</div>
    </div>

    <!-- Temporary Kill Notification (Appears for ~1 second after player kill, then fades away) -->
    <div id="kill-notification" class="kill-notification hidden">
      <span id="kill-text" class="kill-text">1 KILL</span>
    </div>

    <!-- Match Over Modal (Score Breakdown & Final Result) -->
    <div id="game-over-modal" class="modal-layer hidden">
      <div class="modal-card">
        <div class="trophy-badge" id="modal-trophy">👑</div>

        <!-- Score Breakdown Lines (Fist Score, Squeeze Score, Kill Score, Total Score) -->
        <div class="score-breakdown-card" id="modal-breakdown">
          <div class="breakdown-line">
            <span class="breakdown-label">FIST SCORE</span>
            <span class="breakdown-sep">=</span>
            <span class="breakdown-val" id="modal-fist-score">0</span>
          </div>
          <div class="breakdown-line">
            <span class="breakdown-label">SQUEEZE SCORE</span>
            <span class="breakdown-sep">=</span>
            <span class="breakdown-val" id="modal-squeeze-score">0</span>
          </div>
          <div class="breakdown-line">
            <span class="breakdown-label">KILL SCORE</span>
            <span class="breakdown-sep">=</span>
            <span class="breakdown-val" id="modal-kill-score">0</span>
          </div>
          <div class="breakdown-divider"></div>
          <div class="breakdown-line total-line">
            <span class="breakdown-label">TOTAL SCORE</span>
            <span class="breakdown-sep">=</span>
            <span class="breakdown-val" id="modal-total-score">0</span>
          </div>
        </div>

        <!-- Final Result: Displayed AFTER score breakdown -->
        <h1 id="modal-title" class="modal-title">YOU WIN</h1>
        <p id="modal-subtitle" class="modal-subtitle"></p>
        <div class="survival-pill" id="modal-survival">TIME SURVIVED: 0s</div>
      </div>
    </div>

    <!-- Click / Tap Anywhere to Start Overlay (No starting menu) -->
    <div id="tap-to-start-hint" class="tap-to-start-overlay">
      <div class="start-prompt-pulse">CLICK OR TAP ANYWHERE TO START</div>
    </div>

    <!-- Mobile Touch Controls Layer (Automatically shown on mobile / touch devices, strictly hidden on PC) -->
    <div id="mobile-controls" class="mobile-controls-layer">
      <!-- Bottom-Left: ◀ LEFT and ▶ RIGHT -->
      <div class="mobile-cluster-left">
        <button id="touch-left" class="touch-btn dpad-btn" data-key="left" aria-label="Left">
          <span class="touch-arrow">◀</span>
          <span class="touch-label">LEFT</span>
        </button>
        <button id="touch-right" class="touch-btn dpad-btn" data-key="right" aria-label="Right">
          <span class="touch-arrow">▶</span>
          <span class="touch-label">RIGHT</span>
        </button>
      </div>

      <!-- Bottom-Right: JUMP and ATTACK -->
      <div class="mobile-cluster-right">
        <button id="touch-jump" class="touch-btn action-circle jump-circle" data-key="jump" aria-label="Jump">
          <span class="touch-icon">⬆️</span>
          <span class="touch-label">JUMP</span>
        </button>
        <button id="touch-attack" class="touch-btn action-circle attack-circle" data-key="attack" aria-label="Punch">
          <span class="touch-icon">🥊</span>
          <span class="touch-label">PUNCH</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="particles.js"></script>
  <script src="powerups.js"></script>
  <script src="arena.js"></script>
  <script src="characters.js"></script>
  <script src="ai.js"></script>
  <script src="camera.js"></script>
  <script src="input.js"></script>
  <script src="game.js"></script>
</body>
</html>
